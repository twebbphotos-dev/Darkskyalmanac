name: Deploy darkskyalmanac.com

# Deploys only the root-domain site in www/. The app at app.darkskyalmanac.com
# is deployed separately and is not touched by this workflow.
on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
