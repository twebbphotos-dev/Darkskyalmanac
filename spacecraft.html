html,body{margin:0;padding:0;background:#141319}
html,body{min-height:100dvh}
body{padding-top:calc(env(safe-area-inset-top) + 56px);overscroll-behavior:none}
.pwa-nav{position:fixed;top:0;left:0;right:0;z-index:9999;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;contain:layout paint;
  display:flex;justify-content:space-around;align-items:stretch;
  background:rgba(13,10,24,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(203,168,90,.32);padding-top:env(safe-area-inset-top)}
.pwa-navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:7px 0 6px;text-decoration:none;color:#7A6E55;
  font-family:'Montserrat',-apple-system,sans-serif;font-size:8px;letter-spacing:.04em;
  text-transform:uppercase;transition:color .15s}
.pwa-navitem svg{width:18px;height:18px}
.pwa-navitem.active{color:#CBA85A}
.pwa-navitem:active{color:#E6CC85}
#zcl-cal-wrap,#zcl-moon-wrap,#zcl-con-wrap,#zcl-m-wrap,#zcl-sf-wrap,#zcl-idx-wrap,#zcl-sk-wrap,#zcl-ss-wrap{padding-bottom:env(safe-area-inset-bottom) !important}
#pwa-install{position:fixed;left:12px;right:12px;bottom:74px;z-index:10000;
  display:none;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
  background:rgba(13,10,24,.97);border:1px solid rgba(203,168,90,.4);
  box-shadow:0 6px 24px rgba(0,0,0,.5);font-family:'Montserrat',sans-serif}
#pwa-install.show{display:flex}
#pwa-install .txt{flex:1;font-size:12px;color:#C9BD97;line-height:1.4}
#pwa-install .txt b{color:#F2E4BE;font-weight:600}
#pwa-install button{font-family:inherit;font-size:11px;letter-spacing:.1em;font-weight:600;
  text-transform:uppercase;border-radius:5px;padding:8px 12px;cursor:pointer;border:none}
#pwa-install .go{background:#CBA85A;color:#0d0a18}
#pwa-install .dismiss{background:none;color:#7A6E55;border:1px solid rgba(203,168,90,.3)}

/* ── Global night mode (injected into every PWA page) ── */
#pwa-night-overlay{position:fixed;inset:0;pointer-events:none;z-index:10001;
  background:rgba(160,0,0,.0);transition:background .4s ease}
body.night-mode{background:#000 !important}
body.night-mode > *:not(.pwa-nav):not(#zcl-set-modal):not(#es-set-modal):not(#pwa-install){filter:grayscale(1) brightness(0.40) sepia(1) hue-rotate(-40deg) saturate(6) brightness(0.7)}
body.night-mode .pwa-nav{filter:grayscale(1) brightness(0.40) sepia(1) hue-rotate(-40deg) saturate(6) brightness(0.7);background:#0d0a18;backdrop-filter:none;-webkit-backdrop-filter:none}
body.night-mode #zcl-set-modal,body.night-mode #es-set-modal{filter:grayscale(1) brightness(0.40) sepia(1) hue-rotate(-40deg) saturate(6) brightness(0.7)}

#pwa-night-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);z-index:10002;
  width:36px;height:36px;border-radius:50%;
  background:rgba(10,8,20,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(203,168,90,.32);color:#9A8A66;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-family:inherit}
#pwa-night-btn.on{background:rgba(60,0,0,.95);border-color:rgba(120,0,0,.8);color:#CC1111;box-shadow:0 0 8px rgba(100,0,0,.6)}

<style>
#zcl-pl-wrap{position:relative;width:100%;max-width:100%;margin:0 auto;background:#141319;
  font-family:'Montserrat',-apple-system,sans-serif;box-sizing:border-box}
@media(max-width:640px){#zcl-pl-wrap{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}}
#zcl-pl-wrap *{box-sizing:border-box}
#zcl-pl{width:100%;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%,rgba(72,68,86,.30),transparent 55%),
    radial-gradient(ellipse 100% 70% at 50% 110%,rgba(56,54,68,.26),transparent 55%),
    radial-gradient(circle at 50% 40%,#22212c 0%,#1a1922 55%,#141319 100%);
  border-top:1px solid rgba(203,168,90,.26);border-bottom:1px solid rgba(203,168,90,.26);
  box-shadow:inset 0 0 120px rgba(0,0,0,.5)}
#zcl-pl::after{content:'';position:absolute;inset:14px;border:1px solid rgba(203,168,90,.10);pointer-events:none;z-index:2}
.zcl-goldbar{height:2px;background:linear-gradient(to right,transparent,rgba(203,168,90,.7) 30%,rgba(203,168,90,.7) 70%,transparent)}
#zcl-plstars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.zcl-fl{position:absolute;width:40px;height:40px;z-index:3;pointer-events:none;opacity:.58}
.zcl-fl svg{width:100%;height:100%}
.zcl-tl{top:14px;left:14px}.zcl-tr{top:14px;right:14px;transform:scaleX(-1)}
.zcl-bl{bottom:14px;left:14px;transform:scaleY(-1)}.zcl-br{bottom:14px;right:14px;transform:scale(-1,-1)}
.zcl-wrap{position:relative;z-index:4;max-width:1040px;margin:0 auto}
.zcl-titlebar{text-align:center;padding:30px 24px 10px}
.zcl-maintitle{font-size:clamp(22px,3.4vw,34px);font-weight:600;letter-spacing:.06em;color:#F2E4BE;
  text-transform:uppercase;line-height:1.2;text-shadow:0 0 24px rgba(203,168,90,.22)}
.zcl-titlerule{display:flex;align-items:center;justify-content:center;gap:14px;margin:13px auto 4px;max-width:360px}
.zcl-rline{height:1px;flex:1;background:linear-gradient(to right,transparent,rgba(203,168,90,.55))}
.zcl-titlerule .zcl-rline:last-child{background:linear-gradient(to left,transparent,rgba(203,168,90,.55))}
.zcl-rstar{width:16px;height:16px;flex-shrink:0;opacity:.9;filter:drop-shadow(0 0 5px rgba(203,168,90,.5))}

/* time bar */
.zcl-hdr{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 20px 12px}
.zcl-tnav{display:flex;align-items:center;gap:6px}
.zcl-nbtn{width:34px;height:34px;border-radius:50%;background:#0d0a18;border:1px solid rgba(203,168,90,.3);
  color:#CBA85A;font-size:19px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.zcl-nbtn:active{background:rgba(203,168,90,.15)}
.zcl-stamp{font-size:12.5px;letter-spacing:.03em;color:#E4D9B8;min-width:190px;text-align:center;font-variant-numeric:tabular-nums}
.zcl-tbtn{background:none;border:1px solid rgba(203,168,90,.3);border-radius:18px;color:#9A875C;
  font-family:inherit;font-size:11px;letter-spacing:.06em;padding:7px 13px;cursor:pointer;white-space:nowrap}
.zcl-tbtn.on{background:rgba(203,168,90,.16);border-color:#CBA85A;color:#E4D9B8}

/* stages */
.zcl-stage{padding:4px 22px 6px}
.zcl-eyepiece{position:relative;background:radial-gradient(ellipse 80% 90% at 50% 50%,rgba(30,28,40,.7),#08070d 78%);
  border:1px solid rgba(203,168,90,.22);border-radius:12px;overflow:hidden}
.zcl-eyepiece canvas{display:block;width:100%;touch-action:manipulation}
#zcl-hero{aspect-ratio:2.25/1}
#zcl-field{aspect-ratio:2/1}
@media(max-width:560px){#zcl-hero{aspect-ratio:1.9/1}#zcl-field{aspect-ratio:1.12/1}}
.zcl-heroyr{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A7340;pointer-events:none}
.zcl-heroyr b{display:block;font-size:20px;letter-spacing:.04em;color:#E6CC85;font-weight:500;margin-top:2px}
.zcl-bar{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.zcl-vbtn{background:none;border:1px solid rgba(203,168,90,.26);border-radius:20px;color:#9A875C;
  font-family:inherit;font-size:11px;letter-spacing:.05em;padding:6px 13px;cursor:pointer;transition:all .15s}
.zcl-vbtn:hover{border-color:rgba(203,168,90,.55);color:#CBA85A}
.zcl-vbtn.on{background:rgba(203,168,90,.16);border-color:#CBA85A;color:#E4D9B8}
.zcl-vbtn.round{width:32px;height:30px;padding:0;font-size:15px}
.zcl-grp{display:inline-flex;align-items:center;gap:6px}
@media(max-width:520px){#zcl-viewbar .zcl-sep{display:none}}
.zcl-ibtn{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);color:#9A8A66;border:1px solid rgba(203,168,90,.32);
  font-family:'Times New Roman',Georgia,serif;font-size:14px;line-height:1;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.zcl-ibtn:hover{color:#CBA85A;border-color:#CBA85A}
.zcl-ibtn.on{background:rgba(203,168,90,.18);color:#E4D9B8;border-color:#CBA85A}
.zcl-infotxt{max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease,margin .3s;font-size:12.5px;line-height:1.6;color:#C9BD97;margin:0 4px}
.zcl-infotxt.open{max-height:420px;opacity:1;margin:8px 4px 10px}
.zcl-infotxt b{color:#E6CC85;font-weight:500}
.zcl-mkey{text-align:center;font-size:10.5px;color:#8A7340;letter-spacing:.03em;margin:2px 0 6px}
.zcl-mkey i{display:inline-block;width:14px;height:8px;border-radius:2px;margin:0 4px 0 10px;vertical-align:0}
.zcl-mkey i.nb{background:rgba(120,140,200,.22)}
.zcl-mkey i.tw{height:2px;background:#CBA85A;vertical-align:2px}
.zcl-stitle{display:flex;align-items:center;gap:14px;max-width:560px;margin:0 auto 12px;
  font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#CBA85A;white-space:nowrap}
#zcl-field{transition:opacity .2s ease}
#zcl-field.fading{opacity:0}
/* field controls: drift tools live in the eyepiece corner, view + zoom as two segmented bars */
.zcl-ovl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;z-index:2}
.zcl-ovl .zcl-vbtn.round{width:30px;height:30px;background:rgba(8,7,13,.62);font-size:14px}
.zcl-ovl .zcl-ibtn{width:30px;height:30px;background:rgba(8,7,13,.62)}
.zcl-eyepiece.is-top .zcl-ovl{bottom:auto;top:10px}
.zcl-eyepiece.is-top #zcl-rotl,.zcl-eyepiece.is-top #zcl-rotr{display:none}
.zcl-eyepiece .zcl-fov{position:absolute;right:12px;bottom:9px;margin:0;pointer-events:none;font-size:10px}
.zcl-ctlrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.zcl-seg{display:inline-flex;border:1px solid rgba(203,168,90,.24);border-radius:20px;padding:2px;background:rgba(0,0,0,.22)}
.zcl-seg .zcl-vbtn{border:none;border-radius:17px;padding:6px 13px;white-space:nowrap}
.zcl-seg .zcl-vbtn.on{background:rgba(203,168,90,.2);color:#E4D9B8}
.zcl-seg .s{display:none}
@media(max-width:600px){
  .zcl-ctlrow{flex-direction:column;align-items:stretch;gap:7px;margin-top:10px}
  .zcl-seg{display:flex}
  .zcl-seg .zcl-vbtn{flex:1;padding:8px 2px;font-size:11.5px;letter-spacing:.02em}
  .zcl-seg .l{display:none}.zcl-seg .s{display:inline}
  .zcl-ovl{left:8px;bottom:8px}.zcl-eyepiece .zcl-fov{right:9px;bottom:7px;font-size:9.5px}
}
#zcl-rotl,#zcl-rotr{transition:opacity .2s ease}
#zcl-rotl:disabled,#zcl-rotr:disabled{opacity:.25;cursor:default}
@media(max-width:560px){.zcl-stitle{font-size:12.5px;gap:10px}}
.zcl-zlab{min-width:34px;text-align:center;font-size:11px;color:#CBA85A;font-variant-numeric:tabular-nums}
.zcl-yrs{max-width:760px;margin:12px auto 0;padding:10px 12px 4px;border:1px solid rgba(203,168,90,.18);border-radius:10px;background:rgba(13,10,24,.55)}
.zcl-yrs-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
#zcl-ylab,#zcl-mlab{font-size:12.5px;color:#E4D9B8;letter-spacing:.02em}
.zcl-yrs-row{display:flex;align-items:center;gap:10px;margin-top:4px}
.zcl-ytrack{position:relative;flex:1;height:40px;margin-bottom:16px}
.zcl-spark{position:absolute;inset:0;width:100%;height:40px;pointer-events:none}
.zcl-range{position:absolute;inset:0;width:100%;height:40px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-y}
.zcl-range::-webkit-slider-runnable-track{height:40px;background:transparent}
.zcl-range::-moz-range-track{height:40px;background:transparent}
.zcl-range::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:40px;border-radius:2px;background:#E6CC85;box-shadow:0 0 0 3px rgba(230,204,133,.22),0 0 10px rgba(230,204,133,.6)}
.zcl-range::-moz-range-thumb{width:4px;height:40px;border:0;border-radius:2px;background:#E6CC85;box-shadow:0 0 0 3px rgba(230,204,133,.22)}
.zcl-range:focus{outline:none}
.zcl-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(230,204,133,.5)}
.zcl-yticks{position:absolute;left:0;right:0;top:42px;height:14px}
.zcl-yticks span{position:absolute;transform:translateX(-50%);font-size:9.5px;color:#8A7340;letter-spacing:.04em}
@media(max-width:520px){.zcl-yticks span:nth-child(even){display:none}}
.zcl-fov{text-align:right;font-size:10.5px;letter-spacing:.04em;color:#8A7340;margin:6px 4px 0}
.zcl-sep{width:1px;height:18px;background:rgba(203,168,90,.2);margin:0 4px}
.zcl-stagenote{text-align:center;font-size:12.5px;line-height:1.55;color:#9A875C;max-width:700px;margin:10px auto 2px;padding:0 8px}
.zcl-stagenote b{color:#CBA85A;font-weight:500}

/* body */
.zcl-body{padding:10px 28px 26px}
.zcl-psec{margin-bottom:24px;padding-top:4px}
.zcl-psec-label{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#CBA85A;
  margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid rgba(203,168,90,.28)}
.zcl-pcards{display:grid;gap:9px}
.zcl-pcards.cols3{grid-template-columns:1fr 1fr 1fr}
.zcl-pcards.cols4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.zcl-pcards.cols3,.zcl-pcards.cols4{grid-template-columns:1fr 1fr}}
.zcl-pcard{background:#0d0a18;border:1px solid rgba(203,168,90,.18);border-radius:8px;padding:11px 13px}
.zcl-pcard.accent{border-color:rgba(203,168,90,.38);background:rgba(203,168,90,.06)}
.zcl-pclabel{font-size:10px;letter-spacing:.13em;color:#8A6E32;text-transform:uppercase;margin-bottom:6px}
.zcl-pcval{font-size:16px;color:#E4D9B8;line-height:1.2}
.zcl-pcsub{font-size:12.5px;color:#8A7C5C;margin-top:4px;line-height:1.4}
.zcl-note{font-size:12.5px;line-height:1.6;color:#9A875C;margin-top:10px}
.zcl-note b{color:#C9BD97;font-weight:500}

.zcl-moonrow{display:grid;grid-template-columns:32px 1fr auto;gap:0 11px;align-items:center;
  background:#0d0a18;border:1px solid rgba(203,168,90,.16);border-radius:8px;padding:10px 13px;margin-bottom:8px}
/* the moon itself, drawn to scale with the other seven */
.zcl-moonrow .disc{display:flex;align-items:center;justify-content:center;height:32px}
.zcl-moonrow .disc i{display:block;border-radius:50%;flex-shrink:0}
/* where it sits along the ring line: Saturn in the middle, one tick per ring-width */
.zcl-lane{grid-column:1/-1;position:relative;height:24px;margin:7px 0 4px;width:100%;max-width:560px;justify-self:center}
.zcl-lane .ln{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(203,168,90,.24)}
.zcl-lane .tk{position:absolute;top:50%;width:1px;height:7px;margin-top:-3.5px;background:rgba(203,168,90,.45)}
.zcl-lane .sat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0}
.zcl-lane .sat svg{display:block;width:100%;height:auto;overflow:visible}
.zcl-lane .dot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;box-shadow:0 0 9px 2px rgba(255,244,214,.55)}
.zcl-lane .dot.hollow{background:none;border:2px solid;box-shadow:none;opacity:1}
.zcl-lane .dot.hid{opacity:.5;box-shadow:none}
.zcl-lane .far{position:absolute;top:50%;transform:translateY(-54%);font-size:15px;line-height:1;color:#CBA85A}
.zcl-lanehdr{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#8A7340;padding:0 14px;margin:0 auto 7px;max-width:588px}
.zcl-seen{text-align:center;font-size:13px;line-height:1.55;color:#C9BD97;margin:11px auto 0;padding:0 6px;max-width:640px}
.zcl-seen b{color:#F2E4BE;font-weight:600}
.zcl-seen .t{color:#9A875C}
.zcl-seenkey{text-align:center;font-size:11px;line-height:1.5;color:#8A7340;margin:4px auto 2px;padding:0 6px}
.zcl-moonrow .mn{font-size:14.5px;color:#E4D9B8}
.zcl-moonrow .mw{font-size:12.5px;color:#C9BD97;margin-top:2px}
.zcl-moonrow .ms{grid-column:1/-1;font-size:12px;color:#8A7C5C;line-height:1.45}
.zcl-moonrow .vis{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:10px;white-space:nowrap}
.vis.easy{background:rgba(203,168,90,.18);color:#E6CC85}
.vis.good{background:rgba(203,168,90,.10);color:#CBA85A}
.vis.hard{background:rgba(160,140,110,.10);color:#9A875C}
.vis.no{background:rgba(120,120,120,.10);color:#7c7a74}
.zcl-moonrow.dim{opacity:.78}

.zcl-anat canvas{display:block;width:100%}
.zcl-anat{background:#08070d;border:1px solid rgba(203,168,90,.18);border-radius:10px;padding:8px 6px}
.zcl-gaplist{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
@media(max-width:640px){.zcl-gaplist{grid-template-columns:1fr}}

.zcl-tilt svg{display:block;width:100%;height:auto}
.zcl-tilt{background:#08070d;border:1px solid rgba(203,168,90,.18);border-radius:10px;padding:10px 8px 6px}

@media(max-width:520px){#zcl-yspeed .zcl-sep{display:none}.zcl-body{padding:6px 14px 22px}.zcl-stage{padding:4px 10px 6px}.zcl-stamp{min-width:0;font-size:12px}.zcl-hdr{padding:6px 10px 10px}}
/* fit */
@media(max-width:640px){#zcl-pl::after{inset:7px}.zcl-tl,.zcl-tr{top:7px}.zcl-bl,.zcl-br{bottom:7px}.zcl-tl,.zcl-bl{left:7px}.zcl-tr,.zcl-br{right:7px}}
@media(max-width:520px){.zcl-stage{padding-left:14px;padding-right:14px}}

  var backdrop=document.getElementById('zcl-set-backdrop');
  var gear=document.getElementById('pwa-night-btn')||document.getElementById('zcl-sf-nightbtn');
  var loaded=false;
  function open(){
    if(!loaded){ frame.src='settings.html?embed=1'; loaded=true }
    modal.classList.add('on');
  }
  function close(){ modal.classList.remove('on') }
  if(gear){
    gear.addEventListener('click', function(e){ e.preventDefault(); open() });
  }
  backdrop.addEventListener('click', close);
  // Messages from the settings iframe
  window.addEventListener('message', function(e){
    var d=e.data||{};
    if(d.type==='zcl-close'){ close() }
    else if(d.type==='zcl-night'){
      document.body.classList.toggle('night-mode', !!d.on);
      if(gear) gear.classList.toggle('on', !!d.on);
    }
    // zcl-fov: nothing to do live; finder re-reads sfVFOV on open
  });
})();
</script>


<script>
/* PWA install relay — beforeinstallprompt only fires on the top-level page, not
   inside the settings iframe, so we capture it here and bridge it to Settings. */
(function(){
  var deferred = null;
  function frameWin(){
    var f = document.getElementById('zcl-set-frame') || document.getElementById('es-set-frame');
    return f && f.contentWindow ? f.contentWindow : null;
  }
  function tellFrame(msg){ var w = frameWin(); if(w) w.postMessage(msg, '*') }
  window.addEventListener('beforeinstallprompt', function(ev){
    ev.preventDefault();
    deferred = ev;
    tellFrame({ type:'zcl-install-available' });
  });
  window.addEventListener('appinstalled', function(){
    deferred = null;
    tellFrame({ type:'zcl-installed' });
  });
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if(d.type === 'zcl-do-install' && deferred){
      deferred.prompt();
      deferred.userChoice.finally(function(){ deferred = null });
    } else if(d.type === 'zcl-install-query'){
      tellFrame({ type: deferred ? 'zcl-install-available' : 'zcl-install-none' });
    }
  });
})();
</script>
