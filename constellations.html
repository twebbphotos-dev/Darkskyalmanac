const $=id=>document.getElementById(id);
const byKey={}; DATA.forEach(d=>byKey[d.key]=d);
const INTROS={"Winter": {"h": "The brilliant season", "p": ["Winter holds the brightest stars of the year. Six of them — Sirius, Procyon, Pollux, Capella, Aldebaran and Rigel — make a ring called the Winter Hexagon, with Orion standing in the middle and Betelgeuse glowing near its center. Sirius, Procyon and Betelgeuse make the smaller Winter Triangle.", "The stories here are a hunt. Orion faces the charging Bull, Taurus, with his two dogs, Canis Major and Canis Minor, at his heels; the Twins, Gemini, and the Charioteer, Auriga, ride above. The Pleiades and the Hyades, the two nearest star clusters to us, sit on the Bull’s shoulder and face.", "On winter nights we look outward, away from the center of our galaxy, so the Milky Way is faint here. What we gain is star birth: the Orion Nebula, a cloud where new stars are forming right now, is visible to the naked eye in Orion’s sword."]}, "Spring": {"h": "The galaxy season", "p": ["In spring the Big Dipper rides high overhead and points the way to everything else: follow the arc of its handle to Arcturus, then speed on to Spica. Arcturus, Spica and Regulus, the heart of Leo, make the Spring Triangle.", "Leo is the Nemean Lion that Heracles strangled; Virgo the harvest goddess with an ear of wheat; Boötes the herdsman who drives the Bears around the pole.", "In spring we look straight up out of the flat disc of our galaxy, so the Milky Way lies low along the horizon and the dust that hides the distant universe is out of the way. That opens a window into deep space: between Leo and Virgo lie thousands of galaxies in the Virgo Cluster, tens of millions of light-years away."]}, "Summer": {"h": "The Milky Way season", "p": ["Summer is when the Milky Way is at its best. In the south, Scorpius and Sagittarius sit in front of the center of our galaxy, 26,000 light-years away, where the star clouds are thickest and brightest. Dark lanes of dust, the Great Rift, split the band from Cygnus down to Sagittarius.", "Overhead shines the Summer Triangle: Vega in Lyra, Deneb in Cygnus and Altair in Aquila, with the Milky Way running straight through it. In an old Chinese and Japanese legend, Vega is the Weaver Girl and Altair the Cowherd, lovers separated by the Silver River of the Milky Way, allowed to meet once a year when magpies form a bridge — the festival of Qixi, or Tanabata.", "Low in the south, the Scorpion that killed Orion rules the summer nights, with Antares, its red heart, and the Archer aiming at it. Hercules and the serpent bearer Ophiuchus fill the sky above them."]}, "Autumn": {"h": "The royal family and the Sea", "p": ["Autumn’s sky tells one story from end to end. Queen Cassiopeia boasted of her beauty, the sea monster Cetus came, and her daughter Andromeda was chained to the rocks until Perseus rescued her. King Cepheus, the winged horse Pegasus and the monster are all here too.", "The Great Square of Pegasus is the signpost. From its corner, Andromeda’s chain of stars leads to the Andromeda Galaxy, 2.5 million light-years away and the most distant thing most people can see with the naked eye.", "Below lies a region the Babylonians linked with the rainy season: Aquarius the water bearer, the Fishes, the sea goat Capricornus, the whale Cetus and the Southern Fish. Their stars are faint, so bright Fomalhaut, low in the south, is often called the lonely star of autumn."]}, "Circumpolar": {"h": "The Imperishable Stars", "p": ["Stars close to the celestial pole never set. Anything nearer to Polaris than your own latitude circles it all night, every night: from mid-northern latitudes that includes the Little Bear, Cassiopeia, Cepheus and Camelopardalis, with the Big Dipper’s handle and Draco’s head only just dipping below the horizon.", "The Greeks said these stars never bathe in Ocean, the great river they believed circled the world. Homer wrote that the Bear alone “has no part in the baths of Ocean,” and Ovid told why: Hera, jealous of Callisto, made the sea gods swear never to let the Bear wash in their waters. Every other star sank into Ocean and passed beneath the world each day; these never made that journey.", "The Egyptians called them the <i>ikhemu-sek</i>, “the ones who know no destruction” — the Imperishable Stars. All other stars died into the Duat, the underworld, but these never did. The Pyramid Texts tell of the dead king rising to join them, and the Great Pyramid’s northern shafts point toward this unchanging part of the sky.", "Their opposite rides low in the south. Orion and Scorpius rise and set like any mortal star, and they barely share the sky: the Scorpion’s heart, Antares, climbs in the east just as Orion’s shoulder sinks in the west. To the Egyptians Orion was Sah, the soul of Osiris, the god who dies and returns. The imperishable stars circle above; the hunter and his killer chase each other through the southern sky, dying and returning without end."]}};
const SEASONS=['Winter','Spring','Summer','Autumn','Circumpolar'];

// Popularity ranking — the constellations and asterisms people most want to
// find, in rough order of fame/recognizability. Anything not listed sorts
// after these (alphabetically by their natural DATA order). Used to order the
// list so the marquee targets sit at the top.
const POPULARITY=[
  'orion','scorpius','ursamajor','bigdipper','cassiopeia','leo','cygnus',
  'taurus','pleiades','sagittarius','teapot','gemini','canismajor','lyra',
  'andromeda','pegasus','aquila','bootes','perseus','summertriangle',
  'ursaminor','littledipper','draco','hercules','aries','cancer','auriga',
  'northerncross','winterhexagon','greatsquare','sickle','virgo','corona borealis',
  'canisminor','triangulum','cepheus','aquarius','capricornus','cetus',
  'corvus','ophiuchus','serpens','delphinus','coronaborealis','springtriangle',
  'wintertriangle','fishhook','coathanger','kemble','leoMinor','scutum','camelopardalis'
];
function popRank(key){ const i=POPULARITY.indexOf(key); return i<0?999:i }

// Determine the current season from the date so the guide opens on what's
// actually up tonight. (Northern hemisphere, meteorological seasons.)
function currentSeason(){
  const m=new Date().getMonth();           // 0=Jan
  if(m===11||m<=1) return 'Winter';        // Dec–Feb
  if(m<=4) return 'Spring';                // Mar–May
  if(m<=7) return 'Summer';                // Jun–Aug
  return 'Autumn';                         // Sep–Nov
}

let season=currentSeason(), selKey=null;

function renderChips(){
  const chips=$('zcl-c-chips'); chips.innerHTML='';
  ['All',...SEASONS].forEach(s=>{
    const c=document.createElement('span');
    c.className='zcl-c-chip'+(s===season?' on':'');
    c.textContent=s;
    c.addEventListener('click',()=>{ season=s; renderList() });
    chips.appendChild(c);
  });
}

function visible(){
  const base = season==='All' ? DATA.slice() : DATA.filter(d=>d.season===season || (d.also||[]).includes(season));
  // Order by fame so the marquee targets lead the list.
  return base.sort((a,b)=>popRank(a.key)-popRank(b.key));
}

function renderList(){
  renderChips();
  { const it=INTROS[season], box=$('zcl-c-intro'); box.hidden=!it;
    if(it) box.innerHTML='<div class="zcl-c-intro-h">'+it.h+'</div>'+it.p.map(p=>'<p>'+p+'</p>').join(''); }
  const list=$('zcl-c-list'); list.innerHTML='';
  const items=visible();
  if(!items.some(d=>d.key===selKey) && items.length) selKey=items[0].key;
  items.forEach(d=>{
    const el=document.createElement('div');
    el.className='zcl-c-item'+(d.key===selKey?' sel':'');
    el.innerHTML='<span class="zcl-c-item-n">'+d.name+'</span><span class="zcl-c-item-t">'+d.type+' \u00b7 '+d.season+'</span>';
    el.addEventListener('click',()=>{ selKey=d.key; renderList(); renderSelection() });
    list.appendChild(el);
  });
  renderSelection();
  // Update scroll arrows after list is rebuilt (needs a tick for layout)
  setTimeout(function(){ if(window._zcl_updateArrows) window._zcl_updateArrows() }, 40);
}

function drawMap(){
  const d=byKey[selKey],map=$('zcl-c-map');
  // extra margin for figures that have artwork, whether or not it's showing, so
  // toggling the illustration never moves the stars
  map.innerHTML=buildMap(d,520,420,ART[d.key]?76:52);
  map.classList.toggle('labels-hidden',!labelsVisible);
  $('zcl-c-artopt').hidden=!ART[d.key];
}
function renderSelection(){
  const d=byKey[selKey];
  // map
  drawMap();
  $('zcl-c-maptag').innerHTML=(d.type==='Asterism'?'Asterism':'Constellation')+' &middot; <b>'+d.name+'</b>';
  // detail
  const binoc=d.binocular?'<span class="zcl-c-binoc">Binoculars</span>':'';
  $('zcl-c-detail').innerHTML=
    '<div class="zcl-c-dhead"><span class="zcl-c-dname">'+d.name+'</span>'
    +'<span class="zcl-c-dtype">'+d.type+'</span>'+binoc+'</div>'
    +'<div class="zcl-c-dlead">'+d.lead+'</div>'
    +'<div class="zcl-c-dabout">'+d.about+'</div>'
    +(d.myth?'<div class="zcl-c-sec story"><div class="zcl-c-sec-h">'+ICON_MYTH+'The story</div><div class="zcl-c-sec-b">'+d.myth+'</div></div>':'')
    +'<div class="zcl-c-sec where"><div class="zcl-c-sec-h">'+ICON_LOC+'Where in the sky</div><div class="zcl-c-sec-b">'+d.where+'</div></div>'
    +'<div class="zcl-c-sec find"><div class="zcl-c-sec-h">'+ICON_FIND+'How to find it</div><div class="zcl-c-sec-b">'+d.find+'</div></div>'
    +'<div class="zcl-c-sec"><div class="zcl-c-sec-h">'+ICON_OBJ+'What to look for</div><div class="zcl-c-sec-b">'+d.objects+'</div></div>'
    +'<div class="zcl-c-best">Best viewing: <b>'+d.best+'</b></div>';
}

// ════════════════════════  6 · INIT  ════════════════════════
// background star field
(function(){let s='';for(let i=0;i<150;i++){s+='<circle cx="'+(Math.random()*800).toFixed(1)+'" cy="'+(Math.random()*700).toFixed(1)+'" r="'+(Math.random()*.9+.2).toFixed(2)+'" fill="#fff" opacity="'+(Math.random()*.6+.1).toFixed(2)+'"/>'}$('zcl-c-stars').innerHTML=s})();
// corner flourishes
(function(){const fl='<svg viewBox="0 0 40 40" fill="none" stroke="#CBA85A" stroke-width="1" stroke-linecap="round">'
  +'<path d="M2 2 L2 14" stroke-width="1.4"/><path d="M2 2 L14 2" stroke-width="1.4"/>'
  +'<path d="M2 7 C12 7 7 17 17 17" opacity=".9"/><path d="M7 2 C7 12 17 7 17 17" opacity=".9"/>'
  +'<path d="M2 19 C9 19 9 12 2 12" opacity=".55"/><path d="M19 2 C19 9 12 9 12 2" opacity=".55"/>'
  +'<circle cx="17" cy="17" r="1.5" fill="#E6CC85" stroke="none"/><circle cx="2.5" cy="2.5" r="1" fill="#E6CC85" stroke="none"/></svg>';
  document.querySelectorAll('.zcl-c-fl').forEach(el=>el.innerHTML=fl)})();

try{const o=JSON.parse(localStorage.getItem('dsa-con-opts')||'{}');naturalSky=!!o.natural;artOn=!!o.art;labelsVisible=o.names!==false}catch(e){}
$('zcl-c-names').checked=labelsVisible;$('zcl-c-natural').checked=naturalSky;$('zcl-c-art').checked=artOn;
renderList();

// ── scroll arrows: show left/right chevrons when list overflows ─────
(function(){
  const list=$('zcl-c-list');
  const arrowL=$('zcl-c-arrow-l');
  const arrowR=$('zcl-c-arrow-r');
  function updateArrows(){
    if(!arrowL||!arrowR) return;
    const sl=list.scrollLeft;
    const maxSl=list.scrollWidth-list.clientWidth;
    arrowL.classList.toggle('show', sl>6);
    arrowR.classList.toggle('show', maxSl-sl>6);
  }
  list.addEventListener('scroll',updateArrows,{passive:true});
  window.addEventListener('resize',updateArrows,{passive:true});
  // Re-check after every renderList call since the list is rebuilt each time
  const _orig=window.renderList||renderList;
  window._zcl_updateArrows=updateArrows;
  setTimeout(updateArrows,80); // first check after layout settles
})();

// ── star names toggle ────────────────────────────────────────────────
$('zcl-c-names').addEventListener('change',e=>{labelsVisible=e.target.checked;saveOpts();drawMap()});

// ── map options: natural sky, illustrated figure ─────────────────────
function saveOpts(){try{localStorage.setItem('dsa-con-opts',JSON.stringify({names:labelsVisible,natural:naturalSky,art:artOn}))}catch(e){}}
$('zcl-c-natural').addEventListener('change',e=>{naturalSky=e.target.checked;saveOpts();drawMap()});
$('zcl-c-art').addEventListener('change',e=>{artOn=e.target.checked;saveOpts();drawMap()});

})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){console.log('SW failed',e)});
  });

// Ask the browser to keep this app's offline cache even if it sits unused for
// months. Without "persistent" storage, browsers (Safari especially, after ~7
// days of no visits) can evict the whole cache — breaking offline use later.
// persist() is a no-op cost when already granted, so we re-assert it each load.
(function(){
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persisted().then(function(already){
        if(!already){ navigator.storage.persist().catch(function(){}); }
      }).catch(function(){
        navigator.storage.persist().catch(function(){});
      });
    }
  }catch(e){}
})();
</script>

   stays fully functional — only the motion stops. */

<script>
(function(){
  var modal=document.getElementById('zcl-set-modal');
  var frame=document.getElementById('zcl-set-frame');
  var backdrop=document.getElementById('zcl-set-backdrop');
  var gear=document.getElementById('pwa-night-btn')||document.getElementById('zcl-sf-nightbtn');
  var loaded=false;
  function open(){
    if(!loaded){ frame.src='settings.html?embed=1'; loaded=true }
    modal.classList.add('on');
  }
  function close(){ modal.classList.remove('on') }
  if(gear){
    gear.addEventListener('click', function(e){ e.preventDefault(); open() });
  }
  backdrop.addEventListener('click', close);
  // Messages from the settings iframe
  window.addEventListener('message', function(e){
    var d=e.data||{};
    if(d.type==='zcl-close'){ close() }
    else if(d.type==='zcl-night'){
      document.body.classList.toggle('night-mode', !!d.on);
      if(gear) gear.classList.toggle('on', !!d.on);
    }
    // zcl-fov: nothing to do live; finder re-reads sfVFOV on open
  });
})();
</script>


<script>
/* PWA install relay — beforeinstallprompt only fires on the top-level page, not
   inside the settings iframe, so we capture it here and bridge it to Settings. */
(function(){
  var deferred = null;
  function frameWin(){
    var f = document.getElementById('zcl-set-frame') || document.getElementById('es-set-frame');
    return f && f.contentWindow ? f.contentWindow : null;
  }
  function tellFrame(msg){ var w = frameWin(); if(w) w.postMessage(msg, '*') }
  window.addEventListener('beforeinstallprompt', function(ev){
    ev.preventDefault();
    deferred = ev;
    tellFrame({ type:'zcl-install-available' });
  });
  window.addEventListener('appinstalled', function(){
    deferred = null;
    tellFrame({ type:'zcl-installed' });
  });
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if(d.type === 'zcl-do-install' && deferred){
      deferred.prompt();
      deferred.userChoice.finally(function(){ deferred = null });
    } else if(d.type === 'zcl-install-query'){
      tellFrame({ type: deferred ? 'zcl-install-available' : 'zcl-install-none' });
    }
  });
})();
</script>
